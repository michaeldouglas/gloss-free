[project]
name = "libras-translation"
version = "0.1.0"
description = "Aquisição reproduzível de vídeos para pesquisa em tradução Gloss-Free de Libras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.27",
    "ipykernel>=7.3.0",
    "jsonschema>=4.26.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=18",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "typer>=0.12",
]

[project.scripts]
libras = "libras_translation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["dataset/src"]
