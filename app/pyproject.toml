[project]
name = "libras-translation"
version = "0.1.0"
description = "Aquisição reproduzível de vídeos para pesquisa em tradução Gloss-Free de Libras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
libras-translation = "libras_translation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["dataset/src"]
