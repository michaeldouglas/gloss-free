name: Deploy showroom with Jekyll

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "harness/artifacts/**"
      - "harness/core/scripts/build-showroom.ts"
      - "harness/core/assets/showroom.css"
      - "harness/core/assets/showroom-project.json"
      - "harness/core/assets/showroom-report-contract.md"
      - "harness/core/scripts/prepare-presentation-release.ts"
      - "harness/core/scripts/build-presentations.ts"
      - "harness/presentations/**"
      - "harness/.bun-version"
      - "harness/package.json"
      - "app/data/processed/metadata-validation/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: harness/.bun-version

      - name: Install harness dependencies
        working-directory: harness
        run: bun install --frozen-lockfile

      - name: Validate harness before publishing
        working-directory: harness
        run: bun run check

      - name: Test harness and showroom narrative contract
        working-directory: harness
        run: bun test

      - name: Install Slidev dependencies
        working-directory: harness/presentations
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Install Chromium for Slidev exports
        working-directory: harness/presentations
        run: bun run playwright install --with-deps chromium

      - name: Regenerate showroom
        working-directory: harness
        run: bun run core/scripts/build-showroom.ts --repo-root ..

      - name: Build presentation catalog and exports
        working-directory: harness
        run: bun run core/scripts/build-presentations.ts --repo-root .. --site-base /gloss-free/

      - name: Verify generated showroom
        run: test -s docs/index.html && test -s docs/reports/latest.html && test -s docs/data/showroom.json && test -s docs/apresentacoes/index.html && test -s docs/apresentacoes/latest.pptx

      - name: Build Jekyll site from regenerated docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
