name: Continuous integration

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.12"
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install project Python
        run: uv python install 3.13.7

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s dataset/tests -v

  docker:
    name: Docker video-processing build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f app/docker/video-processing/compose.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build video-processing image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/docker/video-processing/Dockerfile
          push: false
          load: true
          tags: libras-video-processing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
